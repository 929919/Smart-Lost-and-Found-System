<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistant · JCU Singapore Lost &amp; Found</title>
  <link rel="icon" href="assets/img/jcu_logo.png" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script>window.PAGE_REQUIRES = "any";</script>
  <script src="assets/js/auth.js"></script>
</head>
<body data-page="assistant">
  <div id="site-header"></div>

  <section class="hero sm">
    <div class="wrap">
      <div class="breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span>
        <a href="index.html">Lost &amp; Found</a><span class="sep">/</span>
        <span>Assistant</span>
      </div>
      <h1>Help Assistant</h1>
      <p class="lede">Ask about collection, policies, or whether your item has been handed in.</p>
    </div>
  </section>

  <main class="wrap section" style="max-width:800px">
    <div class="chat-wrap">
      <div class="chat-head">
        <span class="ava">🤖</span>
        <span class="who"><b>JCU Lost &amp; Found Assistant</b><small>Online · replies instantly</small></span>
      </div>
      <div class="chat-log" id="log"></div>
      <div class="suggestions" id="suggestions"></div>
      <form class="chat-input" id="chatForm">
        <input id="chatInput" type="text" placeholder="Type your message…" autocomplete="off" />
        <button class="btn btn--primary" type="submit">Send</button>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/assistant.js"></script>
</body>
</html>
