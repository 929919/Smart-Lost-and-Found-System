<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit Tests · Smart Lost &amp; Found</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f6f8fa; color: #1a2733; margin: 0; padding: 30px; }
    .wrap { max-width: 820px; margin: 0 auto; }
    h1 { font-family: Georgia, serif; color: #00263a; }
    .summary { display: flex; gap: 12px; margin: 18px 0 24px; }
    .pill { padding: 12px 20px; border-radius: 12px; font-weight: 700; box-shadow: 0 1px 3px rgba(16,38,58,.1); }
    .pill.pass { background: #e2f5ea; color: #1f8a4c; }
    .pill.fail { background: #fce4e2; color: #c0392b; }
    .pill.total { background: #fff; color: #00263a; }
    ul { list-style: none; padding: 0; }
    li { background: #fff; border: 1px solid #e3e8ee; border-left: 4px solid #ccc; border-radius: 8px; padding: 11px 15px; margin-bottom: 8px; font-size: .93rem; display: flex; gap: 10px; align-items: baseline; }
    li.ok { border-left-color: #1f8a4c; }
    li.no { border-left-color: #c0392b; background: #fff6f5; }
    .tag { font-weight: 700; }
    li.ok .tag { color: #1f8a4c; }
    li.no .tag { color: #c0392b; }
    .grp { margin-top: 22px; font-family: Georgia, serif; color: #00263a; font-size: 1.15rem; }
    code { background: #f1f5f9; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🧪 Smart Lost &amp; Found — Unit Tests</h1>
    <p>Zero-install test runner covering the data layer (<code>store.js</code>), the
       matching engine (<code>matching.js</code>) and authentication
       (<code>auth.js</code>, exercised with mock objects). Your real app data is
       snapshotted and restored automatically.</p>
    <div class="summary" id="summary"></div>
    <div id="results"></div>
  </div>

  <script>
    /* Snapshot before any application script can touch storage, and clear the
       session so the route guard in auth.js does not redirect this page.
       PAGE_REQUIRES = "guest" makes the guard a no-op when signed out. */
    window.__SNAPSHOT = {};
    ["slf_jcu_items_v2", "slf_jcu_claims_v1", "slf_jcu_currentUser"]
      .forEach(k => (window.__SNAPSHOT[k] = localStorage.getItem(k)));
    localStorage.removeItem("slf_jcu_currentUser");
    window.PAGE_REQUIRES = "guest";
  </script>

  <!-- Real application modules under test -->
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/matching.js"></script>

  <!-- Test doubles, then the suite -->
  <script src="mocks.js"></script>
  <script src="tests.js"></script>
</body>
</html>
