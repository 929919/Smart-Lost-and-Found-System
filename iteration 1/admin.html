<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Console · JCU Singapore Lost &amp; Found</title>
  <link rel="icon" href="assets/img/jcu_logo.png" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body data-page="admin">
  <div id="site-header"></div>

  <section class="hero sm">
    <div class="wrap">
      <div class="breadcrumb">
        <a href="index.html">Home</a><span class="sep">/</span>
        <a href="index.html">Lost &amp; Found</a><span class="sep">/</span>
        <span>Admin Console</span>
      </div>
      <h1>Admin — Item Management</h1>
      <p class="lede">Update item lifecycle status as items are claimed and returned to their owners.</p>
    </div>
  </section>

  <main class="wrap section">
    <section class="stats" id="stats" style="margin-bottom:26px"></section>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Item</th><th>Category</th><th>Type</th>
            <th>Location</th><th>Shelf</th><th>Logged</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div style="margin-top:20px;display:flex;gap:12px">
      <button class="btn btn--ghost" id="resetBtn">↺ Reset demo data</button>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/store.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
